# To apply this file, run:
# DB_MODULES='$DB_MODULES' envsubst < db-modules-restart-folio.yaml | kubectl -n $namespace apply -f -
apiVersion: batch/v1
kind: CronJob
metadata:
  name: db-modules-restart
  namespace: $namespace
spec: 
  concurrencyPolicy: Forbid
  # schedule: '59 6 * * *' # 11:59 PST
  schedule: '0 0 29 2 1' # noop
  suspend: true
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      backoffLimit: 0
      activeDeadlineSeconds: 3600
      ttlSecondsAfterFinished: 14400 # 4 hours
      template:
        spec:
          serviceAccountName: folio-k8s
          restartPolicy: Never
          containers:
            - name: kubectl
              image: bitnamilegacy/kubectl 
              env:
                - name: DB_MODULES
                  value: | 
                    mod-agreements 
                    mod-audit 
                    mod-batch-print 
                    mod-bulk-operations 
                    mod-calendar 
                    mod-circulation-storage 
                    mod-configuration 
                    mod-copycat 
                    mod-courses 
                    mod-data-export 
                    mod-data-export-spring 
                    mod-data-export-worker 
                    mod-data-import 
                    mod-di-converter-storage 
                    mod-email 
                    mod-erm-usage 
                    mod-erm-usage-harvester 
                    mod-eusage-reports 
                    mod-event-config 
                    mod-feesfines 
                    mod-finance-storage 
                    mod-fqm-manager 
                    mod-inventory 
                    mod-inventory-storage 
                    mod-invoice 
                    mod-invoice-storage 
                    mod-kb-ebsco-java
                    mod-licenses 
                    mod-lists 
                    mod-linked-data
                    mod-login-keycloak 
                    mod-marc-migrations
                    mod-notes 
                    mod-notify 
                    mod-oai-pmh 
                    mod-orders 
                    mod-orders-storage 
                    mod-organizations-storage 
                    mod-password-validator 
                    mod-patron-blocks 
                    mod-permissions 
                    mod-pubsub 
                    mod-quick-marc 
                    mod-reading-room 
                    mod-record-specifications 
                    mod-roles-keycloak 
                    mod-scheduler 
                    mod-search 
                    mod-serials-management 
                    mod-service-interaction 
                    mod-settings 
                    mod-source-record-manager 
                    mod-source-record-storage 
                    mod-tags 
                    mod-template-engine 
                    mod-users 
                    mod-users-keycloak 
              command: [ "/bin/bash", "-c", "--" ]
              args: [ "for M in $DB_MODULES; do kubectl -n $namespace rollout restart deployment/$M; sleep 30; done" ]
