name: PushImage

on: push

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        image:
          - name: folio-eureka-pod
            dockerfile: ./Dockerfile
          - name: folio-custom-theme
            dockerfile: custom-theme/Dockerfile
    
    permissions:
      contents: read
      packages: write
    
    steps:
      - name: Extract branch name
        id: extract_branch
        run: echo "name=branch::$(echo ${GITHUB_REF#refs/heads/})" >> GITHUB_OUTPUT

      - uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2
      
      - name: Log in to Container Registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Build and push ${{ matrix.image.name }}
        uses: docker/build-push-action@v4
        with:
          context: .
          file: ${{ matrix.image.dockerfile }}
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/${{ matrix.image.name }}:${{ steps.extract_branch.outputs.branch }}
