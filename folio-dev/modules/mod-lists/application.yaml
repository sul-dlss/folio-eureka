apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: mod-lists
  namespace: folio-dev
operation:
  sync:
    syncStrategy:
      hook: {}
spec:
  destination:
    namespace: folio-dev
    server: https://kubernetes.default.svc
  project: folio-dev
  sources:
  - chart: mod-lists
    helm:
      valueFiles:
      - $values/folio-dev/modules/mod-lists/overrides.yaml
      - $values/folio-dev/common/resources.yaml
      - $values/folio-dev/common/sidecar.yaml
      - $values/folio-dev/common/probes.yaml
    repoURL: https://sul-dlss.github.io/folio-helm-v2
    targetRevision: 1.1.44
  - ref: values
    repoURL: https://github.com/sul-dlss/folio-eureka
    targetRevision: main
