apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  labels:
    application: app-platform-minimal-2.0.52
    type: module
  name: mod-configuration
  namespace: folio-dev
spec:
  destination:
    namespace: folio-dev
    server: https://kubernetes.default.svc
  project: folio-dev
  sources:
  - chart: mod-configuration
    helm:
      valueFiles:
      - $values/folio-dev/modules/mod-configuration/overrides.yaml
      - $values/folio-dev/modules/mod-configuration/resources.yaml
      - $values/folio-dev/common/sidecar.yaml
      - $values/folio-dev/common/probes.yaml
      - $values/folio-dev/common/java_opts.yaml
    repoURL: https://sul-dlss.github.io/folio-helm-v2
    targetRevision: 5.9.55
  - ref: values
    repoURL: https://github.com/sul-dlss/folio-eureka
    targetRevision: main
