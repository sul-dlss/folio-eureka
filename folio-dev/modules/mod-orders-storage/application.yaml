apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  labels:
    application: app-acquisitions-1.0.29
    type: module
  name: mod-orders-storage
  namespace: folio-dev
spec:
  destination:
    namespace: folio-dev
    server: https://kubernetes.default.svc
  project: folio-dev
  sources:
  - chart: mod-orders-storage
    helm:
      valueFiles:
      - $values/folio-dev/modules/mod-orders-storage/overrides.yaml
      - $values/folio-dev/modules/mod-orders-storage/resources.yaml
      - $values/folio-dev/common/sidecar.yaml
      - $values/folio-dev/common/probes.yaml
      - $values/folio-dev/common/java_opts.yaml
    repoURL: https://sul-dlss.github.io/folio-helm-v2
    targetRevision: 13.6.54
  - ref: values
    repoURL: https://github.com/sul-dlss/folio-eureka
    targetRevision: main
