extraEnvVars: |
  - name: LOGCAT
    value: "listen,path,op,status,db,error"
  - name: MOD_REPORTING_QUERY_TIMEOUT
    value: "300"
  - name: REPORTING_DB_URL
    valueFrom:
      secretKeyRef:
        name: db-credentials
        key: REPORTING_DB_URL
  - name: REPORTING_DB_USER
    valueFrom:
      secretKeyRef:
        name: db-credentials
        key: REPORTING_DB_USER
  - name: REPORTING_DB_PASS
    valueFrom:
      secretKeyRef:
        name: db-credentials
        key: REPORTING_DB_PASS