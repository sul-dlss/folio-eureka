apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: mod-reporting
  namespace: folio-dev
spec:
  destination:
    namespace: folio-dev
    server: https://kubernetes.default.svc
  project: folio-dev
  sources:
  - chart: mod-reporting
    helm:
      valueFiles:
      - $values/folio-dev/modules/mod-reporting/overrides.yaml
      - $values/folio-dev/modules/mod-reporting/resources.yaml
      - $values/folio-dev/common/sidecar.yaml
      - $values/folio-dev/modules/mod-reporting/probes.yaml
      - $values/folio-dev/modules/mod-reporting/extra_env.yaml
    repoURL: https://sul-dlss.github.io/folio-helm-v2
    targetRevision: 1.0.32
  - ref: values
    repoURL: https://github.com/sul-dlss/folio-eureka
    targetRevision: main
