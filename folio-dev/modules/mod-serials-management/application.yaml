apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: mod-serials-management
  namespace: folio-dev
spec:
  destination:
    namespace: folio-dev
    server: https://kubernetes.default.svc
  project: folio-dev
  sources:
  - chart: mod-serials-management
    helm:
      valueFiles:
      - $values/folio-dev/modules/mod-serials-management/overrides.yaml
      - $values/folio-dev/modules/mod-serials-management/resources.yaml
      - $values/folio-dev/common/sidecar.yaml
      - $values/folio-dev/modules/mod-serials-management/probes.yaml
      - $values/folio-dev/common/java_opts.yaml
    repoURL: https://sul-dlss.github.io/folio-helm-v2
    targetRevision: 1.0.53
  - ref: values
    repoURL: https://github.com/sul-dlss/folio-eureka
    targetRevision: main
