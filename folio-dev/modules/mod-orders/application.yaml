apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  labels:
    application: app-acquisitions-1.0.29
    type: module
  name: mod-orders
  namespace: folio-dev
spec:
  destination:
    namespace: folio-dev
    server: https://kubernetes.default.svc
  project: folio-dev
  sources:
  - chart: mod-orders
    helm:
      valueFiles:
      - $values/folio-dev/modules/mod-orders/overrides.yaml
      - $values/folio-dev/modules/mod-orders/resources.yaml
      - $values/folio-dev/common/sidecar.yaml
      - $values/folio-dev/common/probes.yaml
      - $values/folio-dev/modules/mod-orders/java_opts.yaml
    repoURL: https://sul-dlss.github.io/folio-helm-v2
    targetRevision: 12.7.54
  - ref: values
    repoURL: https://github.com/sul-dlss/folio-eureka
    targetRevision: main
