ingress:
  enabled: true
  className: "nginx"
  hosts:
    - host: "folio-sru-dev.stanford.edu"
      paths:
        - path: '/'
          pathType: Prefix
          servicePort: 80
  tls: []
service:
  type: NodePort
  ports:
    - name: sru
      protocol: TCP
      port: 80
      containerPort: 9997
      targetPort: sru
    - name: z3950
      protocol: TCP
      port: 210
      containerPort: 9997
      targetPort: z3950
    - name: zserver
      protocol: TCP
      port: 9997
      containerPort: 9997
      targetPort: zserver
