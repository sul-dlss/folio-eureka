apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: mod-template-engine
  namespace: folio-dev
spec:
  destination:
    namespace: folio-dev
    server: https://kubernetes.default.svc
  project: folio-dev
  sources:
  - chart: mod-template-engine
    helm:
      valueFiles:
      - $values/folio-dev/modules/mod-template-engine/overrides.yaml
      - $values/folio-dev/common/resources.yaml
      - $values/folio-dev/common/sidecar.yaml
      - $values/folio-dev/common/probes.yaml
      - $values/folio-dev/common/java_opts.yaml
    repoURL: https://sul-dlss.github.io/folio-helm-v2
    targetRevision: 1.19.54
  - ref: values
    repoURL: https://github.com/sul-dlss/folio-eureka
    targetRevision: main
