apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  labels:
    application: module
  name: mod-invoice
  namespace: folio-dev
spec:
  destination:
    namespace: folio-dev
    server: https://kubernetes.default.svc
  project: folio-dev
  sources:
  - chart: mod-invoice
    helm:
      valueFiles:
      - $values/folio-dev/modules/mod-invoice/overrides.yaml
      - $values/folio-dev/modules/mod-invoice/resources.yaml
      - $values/folio-dev/common/sidecar.yaml
      - $values/folio-dev/common/probes.yaml
      - $values/folio-dev/modules/mod-invoice/java_opts.yaml
    repoURL: https://sul-dlss.github.io/folio-helm-v2
    targetRevision: 5.8.46
  - ref: values
    repoURL: https://github.com/sul-dlss/folio-eureka
    targetRevision: main
