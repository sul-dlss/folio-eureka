apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  labels:
    application: app-mosaic-1.0.0
    type: module
  name: mod-mosaic
  namespace: folio-dev
spec:
  destination:
    namespace: folio-dev
    server: https://kubernetes.default.svc
  project: folio-dev
  sources:
  - chart: mod-mosaic
    helm:
      valueFiles:
      - $values/folio-dev/modules/mod-mosaic/overrides.yaml
      - $values/folio-dev/common/resources.yaml
      - $values/folio-dev/common/sidecar.yaml
      - $values/folio-dev/common/probes.yaml
      - $values/folio-dev/common/java_opts.yaml
    repoURL: https://sul-dlss.github.io/folio-helm-v2
    targetRevision: 1.1.20
  - ref: values
    repoURL: https://github.com/sul-dlss/folio-eureka
    targetRevision: main
