apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  labels:
    application: app-platform-complete-2.5.10
    type: module
  name: mod-source-record-storage
  namespace: folio-dev
spec:
  destination:
    namespace: folio-dev
    server: https://kubernetes.default.svc
  project: folio-dev
  sources:
  - chart: mod-source-record-storage
    helm:
      valueFiles:
      - $values/folio-dev/modules/mod-source-record-storage/overrides.yaml
      - $values/folio-dev/modules/mod-source-record-storage/resources.yaml
      - $values/folio-dev/common/sidecar.yaml
      - $values/folio-dev/common/probes.yaml
      - $values/folio-dev/modules/mod-source-record-storage/java_opts.yaml
      - $values/folio-dev/modules/mod-source-record-storage/extra_env.yaml
    repoURL: https://sul-dlss.github.io/folio-helm-v2
    targetRevision: 5.8.49
  - ref: values
    repoURL: https://github.com/sul-dlss/folio-eureka
    targetRevision: main
