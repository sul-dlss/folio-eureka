extraDeploy:
  - |
    apiVersion: gateway.networking.k8s.io/v1
    kind: HTTPRoute
    metadata:
      name: edge-ncip-backend
      namespace: folio-dev
      labels:
        access: cors-ip-allowlist
    spec:
      rules:
      - backendRefs:
        - name: edge-ncip
          port: 80
        matches:
          - path:
              type: PathPrefix
              value: /
      hostnames:
      - folio-ncip-dev.stanford.edu
      parentRefs:
      - name: default
        namespace: envoy-gateway-system
