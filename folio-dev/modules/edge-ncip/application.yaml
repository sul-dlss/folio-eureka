apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  labels:
    application: edge
  name: edge-ncip
  namespace: folio-dev
spec:
  destination:
    namespace: folio-dev
    server: https://kubernetes.default.svc
  project: folio-dev
  sources:
  - chart: edge-ncip
    helm:
      valueFiles:
      - $values/folio-dev/modules/edge-ncip/overrides.yaml
      - $values/folio-dev/modules/edge-ncip/resources.yaml
      - $values/folio-dev/common/probes.yaml
      - $values/folio-dev/modules/edge-ncip/service.yaml
      - $values/folio-dev/modules/edge-ncip/java_opts.yaml
      - $values/folio-dev/modules/edge-ncip/extra_env.yaml
    repoURL: https://sul-dlss.github.io/folio-helm-v2
    targetRevision: 1.10.0
  - ref: values
    repoURL: https://github.com/sul-dlss/folio-eureka
    targetRevision: main
