apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: folio-ip-allowlist
  namespace: folio-dev
  labels:
    application: infrastructure
spec:
  project: folio-dev
  destination:
    server: https://kubernetes.default.svc
    namespace: folio-dev
  source:
    path: folio-dev/securitypolicy
    repoURL: https://github.com/sul-dlss/folio-eureka
    targetRevision: main