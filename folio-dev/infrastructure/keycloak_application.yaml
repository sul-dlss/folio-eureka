apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: keycloak
  namespace: folio-dev
spec:
  destination:
    namespace: folio-dev
    server: https://kubernetes.default.svc
  sources:
    - chart: keycloak
      repoURL: https://charts.bitnami.com/bitnami
      targetRevision: 24.7.4
      helm:
        valueFiles:
          - $values/folio-dev/infrastructure/keycloak.yaml
    - repoURL: https://github.com/sul-dlss/folio-eureka
      targetRevision: main
      ref: values
  project: folio-dev
