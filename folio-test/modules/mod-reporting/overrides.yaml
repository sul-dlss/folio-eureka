deploymentStrategy: RollingUpdate
eureka:
  enabled: true
  extraEnvVars:
  - name: FOLIO_SYSTEM_USER_ENABLED
    value: 'false'
  - name: SYSTEM_USER_CREATED
    value: 'false'
  - name: SYSTEM_USER_ENABLED
    value: 'false'
image:
  repository: folioorg/mod-reporting
  tag: 1.5.0
integrations:
  db:
    enabled: true
    existingSecret: db-credentials
  kafka:
    enabled: true
    existingSecret: kafka-credentials
  okapi:
    enabled: false
  s3:
    enabled: true
    existingSecret: s3-credentials
  systemuser:
    enabled: false
podSecurityContext:
  fsGroup: 2000
replicaCount: 2
securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
    - ALL
  runAsNonRoot: true
