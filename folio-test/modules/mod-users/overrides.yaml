deploymentStrategy: RollingUpdate
eureka:
  enabled: true
  extraEnvVars:
  - name: FOLIO_SYSTEM_USER_ENABLED
    value: false
  - name: SYSTEM_USER_CREATED
    value: false
  - name: SYSTEM_USER_ENABLED
    value: false
image:
  repository: folioorg/mod-users
  tag: 19.4.6
integrations:
  db:
    enabled: true
    existingSecret: db-credentials
  kafka:
    enabled: true
    existingSecret: kafka-credentials
  okapi:
    enabled: false
  s3:
    enabled: true
    existingSecret: s3-credentials
  systemuser:
    enabled: false
podSecurityContext:
  fsGroup: 2000
securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
    - ALL
  runAsNonRoot: true
  runAsUser: 1000
