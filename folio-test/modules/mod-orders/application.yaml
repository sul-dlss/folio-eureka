apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  labels:
    application: app-acquisitions-1.0.29
    type: module
  name: mod-orders
  namespace: folio-test
spec:
  destination:
    namespace: folio-test
    server: https://kubernetes.default.svc
  project: folio-test
  sources:
  - chart: mod-orders
    helm:
      valueFiles:
      - $values/folio-test/modules/mod-orders/overrides.yaml
      - $values/folio-test/modules/mod-orders/resources.yaml
      - $values/folio-test/common/sidecar.yaml
      - $values/folio-test/common/probes.yaml
      - $values/folio-test/modules/mod-orders/replicas.yaml
      - $values/folio-test/common/java_opts.yaml
      - $values/folio-test/modules/mod-orders/extra_env.yaml
    repoURL: https://sul-dlss.github.io/folio-helm-v2
    targetRevision: 12.7.54
  - ref: values
    repoURL: https://github.com/sul-dlss/folio-eureka
    targetRevision: main
