apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  labels:
    application: module
  name: mod-inventory
  namespace: folio-test
spec:
  destination:
    namespace: folio-test
    server: https://kubernetes.default.svc
  project: folio-test
  sources:
  - chart: mod-inventory
    helm:
      valueFiles:
      - $values/folio-test/modules/mod-inventory/overrides.yaml
      - $values/folio-test/modules/mod-inventory/resources.yaml
      - $values/folio-test/common/sidecar.yaml
      - $values/folio-test/modules/mod-inventory/probes.yaml
      - $values/folio-test/modules/mod-inventory/replicas.yaml
      - $values/folio-test/common/java_opts.yaml
      - $values/folio-test/modules/mod-inventory/extra_env.yaml
    repoURL: https://sul-dlss.github.io/folio-helm-v2
    targetRevision: 20.2.48
  - ref: values
    repoURL: https://github.com/sul-dlss/folio-eureka
    targetRevision: main
