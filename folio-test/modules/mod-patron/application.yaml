apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  labels:
    application: app-platform-complete-2.5.10
    type: module
  name: mod-patron
  namespace: folio-test
spec:
  destination:
    namespace: folio-test
    server: https://kubernetes.default.svc
  project: folio-test
  sources:
  - chart: mod-patron
    helm:
      valueFiles:
      - $values/folio-test/modules/mod-patron/overrides.yaml
      - $values/folio-test/modules/mod-patron/resources.yaml
      - $values/folio-test/common/sidecar.yaml
      - $values/folio-test/common/probes.yaml
      - $values/folio-test/modules/mod-patron/replicas.yaml
      - $values/folio-test/common/java_opts.yaml
    repoURL: https://sul-dlss.github.io/folio-helm-v2
    targetRevision: 6.0.52
  - ref: values
    repoURL: https://github.com/sul-dlss/folio-eureka
    targetRevision: main
