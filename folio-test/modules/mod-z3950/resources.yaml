resources:
  requests:
    cpu: 50m
    memory: 512M
  limits:
    cpu: 100m
    memory: 1024M

dbMaxPoolSize: 10

configMaps:
  zserver-config:
    enabled: true
    name: zserver-config
    mountPath: /usr/src/app/etc
    fileName: config.sul.json
    existingConfig: zserver.conf
  mod-search-graphql-query:
    enabled: true
    name: mod-search-graphql-query
    mountPath: /usr/src/app/etc
    fileName: mod-search.graphql-query
    existingConfig: mod-search-graphql-query

extraEnvVars: |
  - name: FOLIO_USER
    valueFrom:
      secretKeyRef:
        key: OKAPI_READONLY_APP_USER
        name: db-connect-modules
  - name: FOLIO_PASSWORD
    valueFrom:
      secretKeyRef:
        key: OKAPI_READONLY_APP_PASSWORD
        name: db-connect-modules
