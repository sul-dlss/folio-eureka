service:
  type: NodePort
  ports:
    - name: sru
      protocol: TCP
      port: 80
      containerPort: 9997
      targetPort: sru
    - name: z3950
      protocol: TCP
      port: 210
      containerPort: 9997
      targetPort: z3950
    - name: zserver
      protocol: TCP
      port: 9997
      containerPort: 9997
      targetPort: zserver

extraDeploy:
  - |
    apiVersion: gateway.networking.k8s.io/v1
    kind: HTTPRoute
    metadata:
      name: sru-backend
      namespace: folio-test
    spec:
      rules:
      - backendRefs:
        - name: mod-z3950
          port: 80
        matches:
          - path:
              type: PathPrefix
              value: /
      hostnames:
      - folio-sru-test.stanford.edu
      parentRefs:
      - name: default
        namespace: envoy-gateway-system
    ---
    apiVersion: gateway.envoyproxy.io/v1alpha1
    kind: SecurityPolicy
    metadata:
      name: sru-cors
      namespace: folio-test
    spec:
        targetRefs:
          - kind: HTTPRoute
            group: gateway.networking.k8s.io
            name: sru-backend
        cors:
          allowOrigins:
          - http://kong:8000
          allowMethods:
          - GET
          - OPTIONS
          - POST
          - PUT
    ---
    apiVersion: gateway.envoyproxy.io/v1alpha1
    kind: BackendTrafficPolicy
    metadata:
      name: sru-custom-error-page
      namespace: folio-test
    spec:
        targetRefs:
          - kind: HTTPRoute
            group: gateway.networking.k8s.io
            name: sru-backend
        responseOverride:
          - match:
              statusCodes:
              - type: Value
                value: 403
            response:
              contentType: text/html
              body:
                type: Inline
                inline: "You are not authorized to access FOLIO. A connection to the Stanford Network is required."
    ---
    apiVersion: gateway.envoyproxy.io/v1alpha1
    kind: SecurityPolicy
    metadata:
      name: sru-ip-limits
      namespace: folio-test
    spec:
        targetRefs:
          - kind: HTTPRoute
            group: gateway.networking.k8s.io
            name: sru-backend
        authorization:
          defaultAction: Deny
          rules:
            - action: Allow
              principal:
                clientCIDRs:
                - "34.239.232.112/32"
                - "132.174.2.0/24"
                - "132.174.4.0/24"
                - "132.174.8.0/24"
                - "132.174.100.0/24"
                - "132.174.107.0/24"
                - "104.130.29.217/32"
                - "172.99.68.239/32"
                - "172.99.69.191/32"
                - "172.99.67.176/32"
