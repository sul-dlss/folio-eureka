deploymentStrategy: RollingUpdate
eureka:
  enabled: true
  extraEnvVars:
  - name: FOLIO_SYSTEM_USER_ENABLED
    value: 'false'
  - name: SYSTEM_USER_CREATED
    value: 'false'
  - name: SYSTEM_USER_ENABLED
    value: 'false'
image:
  repository: folioorg/mod-data-export-spring
  tag: 3.5.2
integrations:
  db:
    enabled: true
    existingSecret: db-credentials
  kafka:
    enabled: true
    existingSecret: kafka-credentials
  okapi:
    enabled: false
  systemuser:
    enabled: false
podSecurityContext:
  fsGroup: 2000
replicaCount: 1
securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
    - ALL
  runAsNonRoot: true
  runAsUser: 1000
