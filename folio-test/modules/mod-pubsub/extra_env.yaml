extraEnvVars: |
  - name: OKAPI_URL
    value: "http://localhost:8082"
  - name: SYSTEM_USER_ENABLED
    value: "false"
  - name: SYSTEM_USER_CREATE
    value: "false"
  - name: SYSTEM_USER_NAME
    value: "mod-pubsub"
  - name: SYSTEM_USER_PASSWORD
    valueFrom:
      secretKeyRef:
          name: mod-pubsub-system-user
          key: SYSTEM_USER_PASSWORD
  - name: DB_MAXPOOLSIZE
    value: "20"
