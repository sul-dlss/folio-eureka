apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  labels:
    application: app-erm-usage-2.0.5
    type: module
  name: mod-erm-usage-harvester
  namespace: folio-test
spec:
  destination:
    namespace: folio-test
    server: https://kubernetes.default.svc
  project: folio-test
  sources:
  - chart: mod-erm-usage-harvester
    helm:
      valueFiles:
      - $values/folio-test/modules/mod-erm-usage-harvester/overrides.yaml
      - $values/folio-test/common/resources.yaml
      - $values/folio-test/common/sidecar.yaml
      - $values/folio-test/common/probes.yaml
      - $values/folio-test/common/java_opts.yaml
      - $values/folio-test/modules/mod-erm-usage-harvester/extra_env.yaml
    repoURL: https://sul-dlss.github.io/folio-helm-v2
    targetRevision: 4.4.57
  - ref: values
    repoURL: https://github.com/sul-dlss/folio-eureka
    targetRevision: main
