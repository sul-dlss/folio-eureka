apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  labels:
    application: module
  name: mod-source-record-manager
  namespace: folio-test
spec:
  destination:
    namespace: folio-test
    server: https://kubernetes.default.svc
  project: folio-test
  sources:
  - chart: mod-source-record-manager
    helm:
      valueFiles:
      - $values/folio-test/modules/mod-source-record-manager/overrides.yaml
      - $values/folio-test/modules/mod-source-record-manager/resources.yaml
      - $values/folio-test/common/sidecar.yaml
      - $values/folio-test/common/probes.yaml
      - $values/folio-test/modules/mod-source-record-manager/replicas.yaml
      - $values/folio-test/modules/mod-source-record-manager/java_opts.yaml
      - $values/folio-test/modules/mod-source-record-manager/extra_env.yaml
    repoURL: https://sul-dlss.github.io/folio-helm-v2
    targetRevision: 3.8.48
  - ref: values
    repoURL: https://github.com/sul-dlss/folio-eureka
    targetRevision: main
