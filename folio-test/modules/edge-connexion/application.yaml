apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  labels:
    application: app-edge-complete-2.0.16
    type: edge
  name: edge-connexion
  namespace: folio-test
spec:
  destination:
    namespace: folio-test
    server: https://kubernetes.default.svc
  project: folio-test
  sources:
  - chart: edge-connexion
    helm:
      valueFiles:
      - $values/folio-test/modules/edge-connexion/overrides.yaml
      - $values/folio-test/modules/edge-connexion/resources.yaml
      - $values/folio-test/modules/edge-connexion/probes.yaml
      - $values/folio-test/modules/edge-connexion/service.yaml
      - $values/folio-test/modules/edge-connexion/java_opts.yaml
      - $values/folio-test/modules/edge-connexion/extra_env.yaml
    repoURL: https://sul-dlss.github.io/folio-helm-v2
    targetRevision: 1.1.54
  - ref: values
    repoURL: https://github.com/sul-dlss/folio-eureka
    targetRevision: main
