apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  labels:
    application: app-platform-minimal-2.0.52
    type: module
  name: mod-tags
  namespace: folio-test
spec:
  destination:
    namespace: folio-test
    server: https://kubernetes.default.svc
  project: folio-test
  sources:
  - chart: mod-tags
    helm:
      valueFiles:
      - $values/folio-test/modules/mod-tags/overrides.yaml
      - $values/folio-test/modules/mod-tags/resources.yaml
      - $values/folio-test/common/sidecar.yaml
      - $values/folio-test/common/probes.yaml
      - $values/folio-test/modules/mod-tags/replicas.yaml
      - $values/folio-test/common/java_opts.yaml
    repoURL: https://sul-dlss.github.io/folio-helm-v2
    targetRevision: 2.1.53
  - ref: values
    repoURL: https://github.com/sul-dlss/folio-eureka
    targetRevision: main
