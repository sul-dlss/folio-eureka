apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  labels:
    application: app-platform-complete-2.5.10
    type: module
  name: mod-email
  namespace: folio-test
spec:
  destination:
    namespace: folio-test
    server: https://kubernetes.default.svc
  project: folio-test
  sources:
  - chart: mod-email
    helm:
      valueFiles:
      - $values/folio-test/modules/mod-email/overrides.yaml
      - $values/folio-test/modules/mod-email/resources.yaml
      - $values/folio-test/common/sidecar.yaml
      - $values/folio-test/common/probes.yaml
      - $values/folio-test/modules/mod-email/replicas.yaml
      - $values/folio-test/common/java_opts.yaml
    repoURL: https://sul-dlss.github.io/folio-helm-v2
    targetRevision: 1.16.53
  - ref: values
    repoURL: https://github.com/sul-dlss/folio-eureka
    targetRevision: main
