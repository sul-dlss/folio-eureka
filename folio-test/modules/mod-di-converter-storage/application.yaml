apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  labels:
    application: module
  name: mod-di-converter-storage
  namespace: folio-test
spec:
  destination:
    namespace: folio-test
    server: https://kubernetes.default.svc
  project: folio-test
  sources:
  - chart: mod-di-converter-storage
    helm:
      valueFiles:
      - $values/folio-test/modules/mod-di-converter-storage/overrides.yaml
      - $values/folio-test/modules/mod-di-converter-storage/resources.yaml
      - $values/folio-test/common/sidecar.yaml
      - $values/folio-test/common/probes.yaml
      - $values/folio-test/modules/mod-di-converter-storage/replicas.yaml
      - $values/folio-test/common/java_opts.yaml
    repoURL: https://sul-dlss.github.io/folio-helm-v2
    targetRevision: 2.2.48
  - ref: values
    repoURL: https://github.com/sul-dlss/folio-eureka
    targetRevision: main
