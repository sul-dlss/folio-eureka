apiVersion: gateway.networking.k8s.io/v1
kind: ListenerSet
metadata:
  name: folio-test-listeners
  namespace: folio-test
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  parentRef:
    group: gateway.networking.k8s.io
    kind: Gateway
    name: default
    namespace: envoy-gateway-system
  listeners:
    - name: folio-test
      hostname: folio-test.stanford.edu
      port: 8443
      protocol: HTTPS
      allowedRoutes:
        namespaces:
          from: Same
      tls:
        mode: Terminate
        certificateRefs:
          - group: ""
            kind: Secret
            name: folio-test.stanford.edu-tls
    - name: folio-test-api
      hostname: folio-test-api.stanford.edu
      port: 8443
      protocol: HTTPS
      allowedRoutes:
        namespaces:
          from: Same
      tls:
        mode: Terminate
        certificateRefs:
          - group: ""
            kind: Secret
            name: folio-test-api.stanford.edu-tls
    - name: keycloak-folio-test
      hostname: keycloak-folio-test.stanford.edu
      port: 8443
      protocol: HTTPS
      allowedRoutes:
        namespaces:
          from: Same
      tls:
        mode: Terminate
        certificateRefs:
          - group: ""
            kind: Secret
            name: keycloak-folio-test.stanford.edu-tls
    - name: folio-sru-test
      hostname: folio-sru-test.stanford.edu
      port: 8443
      protocol: HTTPS
      allowedRoutes:
        namespaces:
          from: Same
      tls:
        mode: Terminate
        certificateRefs:
          - group: ""
            kind: Secret
            name: folio-sru-test.stanford.edu-tls
    - name: folio-ncip-test
      hostname: folio-ncip-test.stanford.edu
      port: 8443
      protocol: HTTPS
      allowedRoutes:
        namespaces:
          from: Same
      tls:
        mode: Terminate
        certificateRefs:
          - group: ""
            kind: Secret
            name: folio-ncip-test.stanford.edu-tls
---
# folio-setae-api-test.stanford.edu is the one Stanford-only host here: it resolves
# to the internal VIP, so it uses port 443 and a self-signed cert. The cert-manager
# cluster-issuer annotation is per object, which is why it needs its own ListenerSet.
apiVersion: gateway.networking.k8s.io/v1
kind: ListenerSet
metadata:
  name: folio-test-internal-listeners
  namespace: folio-test
  annotations:
    cert-manager.io/cluster-issuer: selfsigned
spec:
  parentRef:
    group: gateway.networking.k8s.io
    kind: Gateway
    name: default
    namespace: envoy-gateway-system
  listeners:
    - name: folio-setae-api-test
      hostname: folio-setae-api-test.stanford.edu
      port: 443
      protocol: HTTPS
      allowedRoutes:
        namespaces:
          from: Same
      tls:
        mode: Terminate
        certificateRefs:
          - group: ""
            kind: Secret
            name: folio-setae-api-test.stanford.edu-tls
