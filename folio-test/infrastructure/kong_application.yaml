apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kong
  namespace: folio-test
  labels:
    type: infrastructure
spec:
  destination:
    namespace: folio-test
    server: https://kubernetes.default.svc
  sources:
    - chart: kong
      repoURL: https://charts.bitnami.com/bitnami
      targetRevision: 12.0.11
      helm:
        valueFiles:
          - $values/folio-test/infrastructure/kong.yaml
        skipCrds: true
    - repoURL: https://github.com/sul-dlss/folio-eureka
      targetRevision: main
      ref: values
  project: folio-test
