apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: folio-listenerset
  namespace: folio-stage
  labels:
    type: infrastructure
spec:
  project: folio-stage
  destination:
    server: https://kubernetes.default.svc
    namespace: folio-stage
  source:
    path: folio-stage/listenerset
    repoURL: https://github.com/sul-dlss/folio-eureka
    targetRevision: main
