apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: mod-users-keycloak
  namespace: folio-stage
spec:
  destination:
    namespace: folio-stage
    server: https://kubernetes.default.svc
  project: folio-stage
  sources:
  - chart: mod-users-keycloak
    helm:
      valueFiles:
      - $values/folio-stage/modules/mod-users-keycloak/overrides.yaml
      - $values/folio-stage/modules/mod-users-keycloak/resources.yaml
      - $values/folio-stage/common/sidecar.yaml
      - $values/folio-stage/common/probes.yaml
      - $values/folio-stage/common/java_opts.yaml
      - $values/folio-stage/modules/mod-users-keycloak/extra_env.yaml
    repoURL: https://sul-dlss.github.io/folio-helm-v2
    targetRevision: 0.0.51
  - ref: values
    repoURL: https://github.com/sul-dlss/folio-eureka
    targetRevision: main
