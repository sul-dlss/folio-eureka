apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  labels:
    application: edge
  name: edge-sip2
  namespace: folio-stage
spec:
  destination:
    namespace: folio-stage
    server: https://kubernetes.default.svc
  project: folio-stage
  sources:
  - chart: edge-sip2
    helm:
      valueFiles:
      - $values/folio-stage/modules/edge-sip2/overrides.yaml
      - $values/folio-stage/modules/edge-sip2/resources.yaml
      - $values/folio-stage/modules/edge-sip2/probes.yaml
      - $values/folio-stage/modules/edge-sip2/service.yaml
      - $values/folio-stage/modules/edge-sip2/java_opts.yaml
      - $values/folio-stage/modules/edge-sip2/extra_env.yaml
    repoURL: https://sul-dlss.github.io/folio-helm-v2
    targetRevision: 3.1.55
  - ref: values
    repoURL: https://github.com/sul-dlss/folio-eureka
    targetRevision: main
