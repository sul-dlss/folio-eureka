deploymentStrategy: RollingUpdate
eureka:
  enabled: true
  extraEnvVars:
  - name: FOLIO_SYSTEM_USER_ENABLED
    value: 'false'
  - name: SYSTEM_USER_CREATED
    value: 'false'
  - name: SYSTEM_USER_ENABLED
    value: 'false'
image:
  repository: folioorg/edge-sip2
  tag: 3.3.3
integrations:
  eureka-edge:
    enabled: true
    existingSecret: eureka-edge
  okapi:
    enabled: false
  systemuser:
    enabled: false
podSecurityContext:
  fsGroup: 2000
securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
    - ALL
  runAsNonRoot: true
  runAsUser: 1000
