apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: edge-ncip
  namespace: folio-stage
operation:
  sync:
    syncStrategy:
      hook: {}
spec:
  destination:
    namespace: folio-stage
    server: https://kubernetes.default.svc
  project: folio-stage
  sources:
  - chart: edge-ncip
    helm:
      valueFiles:
      - $values/folio-stage/modules/edge-ncip/overrides.yaml
      - $values/folio-stage/modules/edge-ncip/resources.yaml
      - $values/folio-stage/common/probes.yaml
      - $values/folio-stage/modules/edge-ncip/service.yaml
      - $values/folio-stage/modules/edge-ncip/java_opts.yaml
      - $values/folio-stage/modules/edge-ncip/extra_env.yaml
    repoURL: https://sul-dlss.github.io/folio-helm-v2
    targetRevision: 1.9.50
  - ref: values
    repoURL: https://github.com/sul-dlss/folio-eureka
    targetRevision: main
