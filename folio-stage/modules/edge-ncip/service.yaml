extraDeploy:
  - |
    apiVersion: gateway.networking.k8s.io/v1
    kind: HTTPRoute
    metadata:
      name: edge-ncip-backend
      namespace: folio-stage
    spec:
      rules:
      - backendRefs:
        - name: edge-ncip
          port: 80
        matches:
          - path:
              type: PathPrefix
              value: /
      hostnames:
      - folio-ncip-stage.stanford.edu
      parentRefs:
      - group: gateway.networking.k8s.io
        kind: ListenerSet
        name: folio-stage-listeners
        namespace: folio-stage
        sectionName: folio-ncip-stage
    ---
    apiVersion: gateway.envoyproxy.io/v1alpha1
    kind: SecurityPolicy
    metadata:
      name: edge-ncip-cors
      namespace: folio-stage
    spec:
        targetRefs:
          - kind: HTTPRoute
            group: gateway.networking.k8s.io
            name: edge-ncip-backend
        cors:
          allowOrigins:
          - http://kong:8000
          allowMethods:
          - GET
          - OPTIONS
          - POST
          - PUT