apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  labels:
    application: module
  name: mod-users-bl
  namespace: folio-stage
spec:
  destination:
    namespace: folio-stage
    server: https://kubernetes.default.svc
  project: folio-stage
  sources:
  - chart: mod-users-bl
    helm:
      valueFiles:
      - $values/folio-stage/modules/mod-users-bl/overrides.yaml
      - $values/folio-stage/modules/mod-users-bl/resources.yaml
      - $values/folio-stage/common/sidecar.yaml
      - $values/folio-stage/common/probes.yaml
      - $values/folio-stage/common/java_opts.yaml
    repoURL: https://sul-dlss.github.io/folio-helm-v2
    targetRevision: 7.6.53
  - ref: values
    repoURL: https://github.com/sul-dlss/folio-eureka
    targetRevision: main
