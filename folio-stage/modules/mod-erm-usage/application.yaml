apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  labels:
    application: app-erm-usage-2.0.5
    type: module
  name: mod-erm-usage
  namespace: folio-stage
spec:
  destination:
    namespace: folio-stage
    server: https://kubernetes.default.svc
  project: folio-stage
  sources:
  - chart: mod-erm-usage
    helm:
      valueFiles:
      - $values/folio-stage/modules/mod-erm-usage/overrides.yaml
      - $values/folio-stage/modules/mod-erm-usage/resources.yaml
      - $values/folio-stage/common/sidecar.yaml
      - $values/folio-stage/common/probes.yaml
      - $values/folio-stage/common/java_opts.yaml
    repoURL: https://sul-dlss.github.io/folio-helm-v2
    targetRevision: 4.6.53
  - ref: values
    repoURL: https://github.com/sul-dlss/folio-eureka
    targetRevision: main
