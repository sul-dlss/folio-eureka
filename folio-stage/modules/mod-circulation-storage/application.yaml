apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  labels:
    application: app-platform-complete-2.5.10
    type: module
  name: mod-circulation-storage
  namespace: folio-stage
spec:
  destination:
    namespace: folio-stage
    server: https://kubernetes.default.svc
  project: folio-stage
  sources:
  - chart: mod-circulation-storage
    helm:
      valueFiles:
      - $values/folio-stage/modules/mod-circulation-storage/overrides.yaml
      - $values/folio-stage/modules/mod-circulation-storage/resources.yaml
      - $values/folio-stage/common/sidecar.yaml
      - $values/folio-stage/common/probes.yaml
      - $values/folio-stage/common/java_opts.yaml
      - $values/folio-stage/modules/mod-circulation-storage/extra_env.yaml
    repoURL: https://sul-dlss.github.io/folio-helm-v2
    targetRevision: 17.2.48
  - ref: values
    repoURL: https://github.com/sul-dlss/folio-eureka
    targetRevision: main
