apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: mod-batch-print
  namespace: folio-stage
spec:
  destination:
    namespace: folio-stage
    server: https://kubernetes.default.svc
  project: folio-stage
  sources:
  - chart: mod-batch-print
    helm:
      valueFiles:
      - $values/folio-stage/modules/mod-batch-print/overrides.yaml
      - $values/folio-stage/common/resources.yaml
      - $values/folio-stage/common/sidecar.yaml
      - $values/folio-stage/common/probes.yaml
      - $values/folio-stage/common/java_opts.yaml
    repoURL: https://sul-dlss.github.io/folio-helm-v2
    targetRevision: 1.0.49
  - ref: values
    repoURL: https://github.com/sul-dlss/folio-eureka
    targetRevision: main
