apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: edge-connexion
  namespace: folio-stage
spec:
  destination:
    namespace: folio-stage
    server: https://kubernetes.default.svc
  project: folio-stage
  sources:
  - chart: edge-connexion
    helm:
      valueFiles:
      - $values/folio-stage/modules/edge-connexion/overrides.yaml
      - $values/folio-stage/modules/edge-connexion/resources.yaml
      - $values/folio-stage/modules/edge-connexion/probes.yaml
      - $values/folio-stage/modules/edge-connexion/service.yaml
      - $values/folio-stage/modules/edge-connexion/java_opts.yaml
      - $values/folio-stage/modules/edge-connexion/extra_env.yaml
    repoURL: https://sul-dlss.github.io/folio-helm-v2
    targetRevision: 1.1.49
  - ref: values
    repoURL: https://github.com/sul-dlss/folio-eureka
    targetRevision: main
