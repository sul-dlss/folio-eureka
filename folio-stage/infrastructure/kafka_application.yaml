apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kafka-folio-stage
  namespace: folio-stage
operation:
  sync:
    syncStrategy:
      hook: {}
spec:
  project: folio-stage
  destination:
    server: https://kubernetes.default.svc
    namespace: folio-stage
  sources:
    - repoURL: oci://registry-1.docker.io/bitnamicharts/kafka
      chart: kafka
      targetRevision: 31.1.0
      helm:
        valueFiles:
        - $values/folio-stage/infrastructure/kafka.yaml
    - repoURL: https://github.com/sul-dlss/folio-eureka
      targetRevision: main
      ref: values