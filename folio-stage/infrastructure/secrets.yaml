apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: vault-kv-db-credentials
  namespace: folio-stage
spec:
  type: kv-v2
  mount: puppet
  # path of the secret
  path: application/folio-k8s/folio-stage/db-credentials
  # dest k8s secret
  destination:
    name: db-credentials
    create: true
    overwrite: true
  # static secret refresh interval
  refreshAfter: 10m
---
