apiVersion: v1
kind: ServiceAccount
metadata:
  name: setae-api
  labels:
    app.kubernetes.io/name: setae-api
    app.kubernetes.io/instance: setae-api
    app.kubernetes.io/version: "1.0.0"
---
apiVersion: v1
kind: Service
metadata:
  name: setae-api
  labels:
    app.kubernetes.io/name: setae-api
    app.kubernetes.io/instance: setae-api
    app.kubernetes.io/version: "1.0.0"
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: 80
      protocol: TCP
      name: http
  selector:
    app.kubernetes.io/name: setae-api
    app.kubernetes.io/instance: setae-api
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: setae-api
  labels:
    app.kubernetes.io/name: setae-api
    app.kubernetes.io/instance: setae-api
    app.kubernetes.io/version: "1.0.0"
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: setae-api
      app.kubernetes.io/instance: setae-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: setae-api
        app.kubernetes.io/instance: setae-api
    spec:
      serviceAccountName: setae-api
      securityContext:
        {}
      containers:
        - name: setae-api
          securityContext:
            {}
          image: "ghcr.io/sul-dlss/folio-setae-api:docker-fastapi"
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 80
              protocol: TCP
          env:
              # The base image by default will use the number of available cores to create the worker processes.
              # This will be a very high number by default when deployed in the cluster!
              # See '/gunicorn_conf.py' on base image: tiangolo/uvicorn-gunicorn-fastapi:python3.8
            - name: WORKERS_PER_CORE
              value: ".05"
            - name: OKAPI_URL
              valueFrom:
                secretKeyRef:
                  key: KONG_URL
                  name: folio-eureka
            - name: OKAPI_TENANT
              value: "sul"
            - name: OKAPI_USER
              valueFrom:
                secretKeyRef:
                  key: READONLY_APP_USER
                  name: folio-eureka
            - name: OKAPI_PASSWORD
              valueFrom:
                secretKeyRef:
                  key: READONLY_APP_PASSWORD
                  name: folio-eureka
          resources:
            limits:
              cpu: 150m
              memory: 512M
            requests:
              cpu: 50m
              memory: 256M
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: BackendTrafficPolicy
metadata:
  name: setae-api-custom-error-page
  namespace: folio-stage
spec:
    targetRefs:
      - kind: HTTPRoute
        group: gateway.networking.k8s.io
        name: setae-api-backend
    responseOverride:
      - match:
          statusCodes:
          - type: Value
            value: 403
        response:
          contentType: text/html
          body:
            type: Inline
            inline: "You are not authorized to access FOLIO. A connection to the Stanford Network is required."
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: setae-api-backend
  namespace: folio-stage
  labels:
        access: cors-ip-allowlist
spec:
  rules:
  - backendRefs:
    - name: setae-api
      port: 80
    matches:
      - path:
          type: PathPrefix
          value: /
  hostnames:
  - folio-setae-api-stage.stanford.edu
  parentRefs:
  - name: default
    namespace: envoy-gateway-system
