apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: keycloak
  namespace: folio-stage
operation:
  sync:
    syncStrategy:
      hook: {}
spec:
  destination:
    namespace: folio-stage
    server: https://kubernetes.default.svc
  sources:
    - chart: keycloak
      repoURL: oci://registry-1.docker.io/bitnamicharts/keycloak
      targetRevision: 24.7.4
      helm:
        valueFiles:
          - $values/folio-stage/infrastructure/keycloak.yaml
          - $values/folio-stage/infrastructure/allowed_ips.yaml
    - repoURL: https://github.com/sul-dlss/folio-eureka
      targetRevision: main
      ref: values
  project: folio-stage
