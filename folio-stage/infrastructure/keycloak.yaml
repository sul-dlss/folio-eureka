global: 
  security: 
    allowInsecureImages: true
image:
  registry: folioorg
  repository: folio-keycloak
  tag: 26.5.2
  pullPolicy: Always
auth:
  adminUser: admin
  existingSecret: keycloak-credentials
  passwordSecretKey: KC_BOOTSTRAP_ADMIN_PASSWORD
usePasswordFiles: false
extraEnvVars:
  - name: KEYCLOAK_PROXY_ADDRESS_FORWARDING
    value: "true"
  - name: PROXY_ADDRESS_FORWARDING
    value: "true"
  - name: KC_HTTP_ENABLED
    value: "true"
  - name: KC_HTTP_PORT
    value: "8080"
  - name: KC_HEALTH_ENABLED
    value: "true"
  - name: KC_LOG_LEVEL
    value: "INFO"
  - name: KC_HOSTNAME_BACKCHANNEL_DYNAMIC
    value: "true"
  - name: FIPS
    value: "false"
  - name: KC_HOSTNAME
    value: "https://keycloak-folio-stage.stanford.edu"
  - name: KC_HOSTNAME_DEBUG
    value: "true"
  - name: KC_FOLIO_BE_ADMIN_CLIENT_ID
    valueFrom:
      secretKeyRef:
        name: eureka-common
        key: KC_ADMIN_CLIENT_ID
  - name: KC_FOLIO_BE_ADMIN_CLIENT_SECRET
    valueFrom:
      secretKeyRef:
        name: keycloak-credentials
        key: KC_FOLIO_BE_ADMIN_CLIENT_SECRET
  - name: KC_HTTPS_KEY_STORE_PASSWORD
    valueFrom:
      secretKeyRef:
        name: keycloak-credentials
        key: KC_HTTPS_KEY_STORE_PASSWORD
  - name: KC_DB_PASSWORD
    valueFrom:
      secretKeyRef:
        name: keycloak-credentials
        key: KC_DB_PASSWORD
  - name: KC_DB_URL_DATABASE
    valueFrom:
      secretKeyRef:
        name: keycloak-credentials
        key: KC_DB_URL_DATABASE
  - name: KC_DB_URL_HOST
    valueFrom:
      secretKeyRef:
        name: keycloak-credentials
        key: KC_DB_URL_HOST
  - name: KC_DB_URL_PORT
    valueFrom:
      secretKeyRef:
        name: keycloak-credentials
        key: KC_DB_URL_PORT
  - name: KC_DB_USERNAME
    valueFrom:
      secretKeyRef:
        name: keycloak-credentials
        key: KC_DB_USERNAME
  - name: KC_BOOTSTRAP_ADMIN_USERNAME
    valueFrom:
      secretKeyRef:
        name: keycloak-credentials
        key: KC_BOOTSTRAP_ADMIN_USERNAME
  - name: KC_BOOTSTRAP_ADMIN_PASSWORD
    valueFrom:
      secretKeyRef:
        name: keycloak-credentials
        key: KC_BOOTSTRAP_ADMIN_PASSWORD
  - name: BASE_LOGO_FILES_URL
    value: "http://folio-stage.stanford.edu"
proxy: "edge"
pdb:
  create: false
resources:
  requests:
    memory: 3072Mi
  limits:
    memory: 4096Mi
postgresql:
  enabled: false
externalDatabase:
  host: "sul-folio-db-stage.stanford.edu"
  port: 9999
  database: "keycloak"
  user: "keycloak"
  existingSecret: keycloak-credentials
  existingSecretUserKey: KC_DB_USERNAME
  existingSecretPasswordKey: KC_DB_PASSWORD
  name: "keycloak" 
logging:
  output: default
  level: DEBUG
enableDefaultInitContainers: false
containerSecurityContext:
  enabled: false
networkPolicy:
  enabled: false
service:
  ports:
    http: 8080
    https: 8443
ingress:
  enabled: false
adminIngress:
  enabled: false
livenessProbe:
  enabled: true
  initialDelaySeconds: 60
  periodSeconds: 1
  timeoutSeconds: 10
  failureThreshold: 5
  successThreshold: 1
readinessProbe:
  enabled: true
  initialDelaySeconds: 30
  periodSeconds: 10
  timeoutSeconds: 10
  failureThreshold: 10
  successThreshold: 1
startupProbe:
  enabled: false
  initialDelaySeconds: 30
  periodSeconds: 5
  timeoutSeconds: 1
  failureThreshold: 300
  successThreshold: 1
# Blocks pod startup until Keycloak can open a session on the external database,
# so a pod on a node without database connectivity stays visibly in Init:0/1.
initContainers:
  - name: db-check
    image: postgres:16-alpine
    imagePullPolicy: IfNotPresent
    command: ["sh", "-c"]
    args:
      - >-
        until PGPASSWORD="$KC_DB_PASSWORD" psql -h "$KC_DB_URL_HOST" -p "$KC_DB_URL_PORT" -U "$KC_DB_USERNAME"
        -d "$KC_DB_URL_DATABASE" -tAc 'select 1' >/dev/null; do
        echo "Cannot connect to database $KC_DB_URL_HOST:$KC_DB_URL_PORT, retrying in 10s";
        sleep 10;
        done
    env:
      - name: KC_DB_URL_HOST
        valueFrom:
          secretKeyRef:
            name: keycloak-credentials
            key: KC_DB_URL_HOST
      - name: KC_DB_URL_PORT
        valueFrom:
          secretKeyRef:
            name: keycloak-credentials
            key: KC_DB_URL_PORT
      - name: KC_DB_URL_DATABASE
        valueFrom:
          secretKeyRef:
            name: keycloak-credentials
            key: KC_DB_URL_DATABASE
      - name: KC_DB_USERNAME
        valueFrom:
          secretKeyRef:
            name: keycloak-credentials
            key: KC_DB_USERNAME
      - name: KC_DB_PASSWORD
        valueFrom:
          secretKeyRef:
            name: keycloak-credentials
            key: KC_DB_PASSWORD
    resources:
      requests:
        cpu: 10m
        memory: 32Mi
      limits:
        cpu: 100m
        memory: 64Mi
    securityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop:
          - ALL
      runAsNonRoot: true
      runAsUser: 70
extraDeploy:
  - |
    apiVersion: gateway.envoyproxy.io/v1alpha1
    kind: BackendTrafficPolicy
    metadata:
      name: keycloak-custom-error-page
      namespace: folio-stage
    spec:
        targetRefs:
          - kind: HTTPRoute
            group: gateway.networking.k8s.io
            name: keycloak-backend
        responseOverride:
          - match:
              statusCodes:
              - type: Value
                value: 403
            response:
              contentType: text/html
              body:
                type: Inline
                inline: "You are not authorized to access FOLIO. A connection to the Stanford Network is required."
    ---
    apiVersion: gateway.networking.k8s.io/v1
    kind: HTTPRoute
    metadata:
      name: keycloak-backend
      namespace: folio-stage
      labels:
        access: ip-allowlist
    spec:
      hostnames:
      - keycloak-folio-stage.stanford.edu
      parentRefs:
      - name: default
        namespace: envoy-gateway-system
      rules:
      - backendRefs:
        - name: keycloak
          port: 8080
        matches:
        - path:
            type: PathPrefix
            value: /
