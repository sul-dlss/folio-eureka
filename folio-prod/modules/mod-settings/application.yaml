apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  labels:
    application: app-platform-minimal-2.0.52
    type: module
  name: mod-settings
  namespace: folio-prod
spec:
  destination:
    namespace: folio-prod
    server: https://kubernetes.default.svc
  project: folio-prod
  sources:
  - chart: mod-settings
    helm:
      valueFiles:
      - $values/folio-prod/modules/mod-settings/overrides.yaml
      - $values/folio-prod/common/resources.yaml
      - $values/folio-prod/common/sidecar.yaml
      - $values/folio-prod/common/probes.yaml
      - $values/folio-prod/modules/mod-settings/replicas.yaml
      - $values/folio-prod/common/java_opts.yaml
      - $values/folio-prod/modules/mod-settings/extra_env.yaml
    repoURL: https://sul-dlss.github.io/folio-helm-v2
    targetRevision: 1.0.55
  - ref: values
    repoURL: https://github.com/sul-dlss/folio-eureka
    targetRevision: main
