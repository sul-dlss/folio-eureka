apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  labels:
    application: app-platform-complete-2.5.10
    type: module
  name: mod-courses
  namespace: folio-prod
spec:
  destination:
    namespace: folio-prod
    server: https://kubernetes.default.svc
  project: folio-prod
  sources:
  - chart: mod-courses
    helm:
      valueFiles:
      - $values/folio-prod/modules/mod-courses/overrides.yaml
      - $values/folio-prod/modules/mod-courses/resources.yaml
      - $values/folio-prod/common/sidecar.yaml
      - $values/folio-prod/common/probes.yaml
      - $values/folio-prod/modules/mod-courses/replicas.yaml
      - $values/folio-prod/common/java_opts.yaml
    repoURL: https://sul-dlss.github.io/folio-helm-v2
    targetRevision: 1.5.48
  - ref: values
    repoURL: https://github.com/sul-dlss/folio-eureka
    targetRevision: main
