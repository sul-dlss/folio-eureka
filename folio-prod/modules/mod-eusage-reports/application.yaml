apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  labels:
    application: app-erm-usage-2.0.5
    type: module
  name: mod-eusage-reports
  namespace: folio-prod
spec:
  destination:
    namespace: folio-prod
    server: https://kubernetes.default.svc
  project: folio-prod
  sources:
  - chart: mod-eusage-reports
    helm:
      valueFiles:
      - $values/folio-prod/modules/mod-eusage-reports/overrides.yaml
      - $values/folio-prod/common/resources.yaml
      - $values/folio-prod/common/sidecar.yaml
      - $values/folio-prod/common/probes.yaml
      - $values/folio-prod/modules/mod-eusage-reports/replicas.yaml
      - $values/folio-prod/common/java_opts.yaml
    repoURL: https://sul-dlss.github.io/folio-helm-v2
    targetRevision: 2.0.53
  - ref: values
    repoURL: https://github.com/sul-dlss/folio-eureka
    targetRevision: main
