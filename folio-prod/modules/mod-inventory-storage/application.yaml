apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: mod-inventory-storage
  namespace: folio-prod
spec:
  destination:
    namespace: folio-prod
    server: https://kubernetes.default.svc
  project: folio-prod
  sources:
  - chart: mod-inventory-storage
    helm:
      valueFiles:
      - $values/folio-prod/modules/mod-inventory-storage/overrides.yaml
      - $values/folio-prod/modules/mod-inventory-storage/resources.yaml
      - $values/folio-prod/modules/mod-inventory-storage/sidecar.yaml
      - $values/folio-prod/common/probes.yaml
      - $values/folio-prod/modules/mod-inventory-storage/replicas.yaml
      - $values/folio-prod/modules/mod-inventory-storage/extra_env.yaml
    repoURL: https://sul-dlss.github.io/folio-helm-v2
    targetRevision: 27.1.42
  - ref: values
    repoURL: https://github.com/sul-dlss/folio-eureka
    targetRevision: main
