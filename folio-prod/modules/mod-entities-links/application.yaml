apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: mod-entities-links
  namespace: folio-prod
spec:
  destination:
    namespace: folio-prod
    server: https://kubernetes.default.svc
  project: folio-prod
  sources:
  - chart: mod-entities-links
    helm:
      valueFiles:
      - $values/folio-prod/modules/mod-entities-links/overrides.yaml
      - $values/folio-prod/modules/mod-entities-links/resources.yaml
      - $values/folio-prod/common/sidecar.yaml
      - $values/folio-prod/common/probes.yaml
      - $values/folio-prod/common/java_opts.yaml
      - $values/folio-prod/modules/mod-entities-links/extra_env.yaml
    repoURL: https://sul-dlss.github.io/folio-helm-v2
    targetRevision: 2.1.43
  - ref: values
    repoURL: https://github.com/sul-dlss/folio-eureka
    targetRevision: main
