configMaps:
  zserver-config:
    enabled: true
    name: zserver-config
    mountPath: /usr/src/app/etc
    fileName: config.sul.json
    existingConfig: zserver.conf
  ssl2022cert:
    enabled: true
    name: ssl2022cert.conf
    mountPath: /usr/src/app/etc
    fileName: ssl2022.crt
    existingConfig: ssl2022cert.conf
  mod-search-graphql-query:
    enabled: true
    name: mod-search-graphql-query
    mountPath: /usr/src/app/etc
    fileName: mod-search.graphql-query
    existingConfig: mod-search-graphql-query

extraEnvVars: |
  - name: FOLIO_USER
    valueFrom:
      secretKeyRef:
        key: READONLY_APP_USER
        name: folio-eureka
  - name: FOLIO_PASSWORD
    valueFrom:
      secretKeyRef:
        key: READONLY_APP_PASSWORD
        name: folio-eureka
  - name: PERL_LWP_SSL_CA_FILE
    value: /usr/src/app/etc/ssl2022.crt
