service:
  type: NodePort
  ports:
    - name: sru
      protocol: TCP
      port: 80
      containerPort: 9997
      targetPort: sru
    - name: z3950
      protocol: TCP
      port: 210
      containerPort: 9997
      targetPort: z3950
    - name: zserver
      protocol: TCP
      port: 9997
      containerPort: 9997
      targetPort: zserver
ingress:
  enabled: true
  className: "nginx"
  hosts:
    - host: "folio-sru-prod.stanford.edu"
      paths:
        - path: '/'
          pathType: Prefix
          servicePort: 80
  tls: []

extraDeploy:
  - |
    apiVersion: gateway.networking.k8s.io/v1
    kind: HTTPRoute
    metadata:
      name: sru-backend
      namespace: folio-prod
    spec:
      rules:
      - backendRefs:
        - name: mod-z3950
          port: 80
        matches:
          - path:
              type: PathPrefix
              value: /
      hostnames:
      - folio-sru-prod.stanford.edu
      parentRefs:
      - name: default
        namespace: envoy-gateway-system
    ---
    apiVersion: gateway.envoyproxy.io/v1alpha1
    kind: SecurityPolicy
    metadata:
      name: sru-cors
      namespace: folio-prod
    spec:
        targetRefs:
          - kind: HTTPRoute
            group: gateway.networking.k8s.io
            name: sru-backend
        cors:
          allowOrigins:
          - http://kong:8000
          allowMethods:
          - GET
          - OPTIONS
          - POST
          - PUT
