apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: mod-event-config
  namespace: folio-prod
spec:
  destination:
    namespace: folio-prod
    server: https://kubernetes.default.svc
  project: folio-prod
  sources:
  - chart: mod-event-config
    helm:
      valueFiles:
      - $values/folio-prod/modules/mod-event-config/overrides.yaml
      - $values/folio-prod/modules/mod-event-config/resources.yaml
      - $values/folio-prod/common/sidecar.yaml
      - $values/folio-prod/common/probes.yaml
      - $values/folio-prod/modules/mod-event-config/replicas.yaml
    repoURL: https://sul-dlss.github.io/folio-helm-v2
    targetRevision: 2.6.48
  - ref: values
    repoURL: https://github.com/sul-dlss/folio-eureka
    targetRevision: main
