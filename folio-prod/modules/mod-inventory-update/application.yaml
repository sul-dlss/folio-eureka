apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: mod-inventory-update
  namespace: folio-prod
spec:
  destination:
    namespace: folio-prod
    server: https://kubernetes.default.svc
  project: folio-prod
  sources:
  - chart: mod-inventory-update
    helm:
      valueFiles:
      - $values/folio-prod/modules/mod-inventory-update/overrides.yaml
      - $values/folio-prod/common/resources.yaml
      - $values/folio-prod/common/sidecar.yaml
      - $values/folio-prod/modules/mod-inventory-update/probes.yaml
      - $values/folio-prod/modules/mod-inventory-update/replicas.yaml
    repoURL: https://sul-dlss.github.io/folio-helm-v2
    targetRevision: 3.2.50
  - ref: values
    repoURL: https://github.com/sul-dlss/folio-eureka
    targetRevision: main
