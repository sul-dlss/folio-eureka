apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: mod-di-converter-storage
  namespace: folio-prod
spec:
  destination:
    namespace: folio-prod
    server: https://kubernetes.default.svc
  project: folio-prod
  sources:
  - chart: mod-di-converter-storage
    helm:
      valueFiles:
      - $values/folio-prod/modules/mod-di-converter-storage/overrides.yaml
      - $values/folio-prod/modules/mod-di-converter-storage/resources.yaml
      - $values/folio-prod/common/sidecar.yaml
      - $values/folio-prod/common/probes.yaml
      - $values/folio-prod/common/java_opts.yaml
    repoURL: https://sul-dlss.github.io/folio-helm-v2
    targetRevision: 2.2.43
  - ref: values
    repoURL: https://github.com/sul-dlss/folio-eureka
    targetRevision: main
