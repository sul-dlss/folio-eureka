apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  labels:
    application: app-acquisitions-1.0.29
    type: module
  name: mod-invoice
  namespace: folio-prod
spec:
  destination:
    namespace: folio-prod
    server: https://kubernetes.default.svc
  project: folio-prod
  sources:
  - chart: mod-invoice
    helm:
      valueFiles:
      - $values/folio-prod/modules/mod-invoice/overrides.yaml
      - $values/folio-prod/modules/mod-invoice/resources.yaml
      - $values/folio-prod/common/sidecar.yaml
      - $values/folio-prod/common/probes.yaml
      - $values/folio-prod/modules/mod-invoice/replicas.yaml
      - $values/folio-prod/common/java_opts.yaml
    repoURL: https://sul-dlss.github.io/folio-helm-v2
    targetRevision: 5.8.46
  - ref: values
    repoURL: https://github.com/sul-dlss/folio-eureka
    targetRevision: main
