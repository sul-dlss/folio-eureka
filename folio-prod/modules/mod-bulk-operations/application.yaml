apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: mod-bulk-operations
  namespace: folio-prod
spec:
  destination:
    namespace: folio-prod
    server: https://kubernetes.default.svc
  project: folio-prod
  sources:
  - chart: mod-bulk-operations
    helm:
      valueFiles:
      - $values/folio-prod/modules/mod-bulk-operations/overrides.yaml
      - $values/folio-prod/modules/mod-bulk-operations/resources.yaml
      - $values/folio-prod/common/sidecar.yaml
      - $values/folio-prod/common/probes.yaml
      - $values/folio-prod/modules/mod-bulk-operations/java_opts.yaml
      - $values/folio-prod/modules/mod-bulk-operations/extra_env.yaml
    repoURL: https://sul-dlss.github.io/folio-helm-v2
    targetRevision: 1.2.44
  - ref: values
    repoURL: https://github.com/sul-dlss/folio-eureka
    targetRevision: main
