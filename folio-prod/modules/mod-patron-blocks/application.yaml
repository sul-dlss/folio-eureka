apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: mod-patron-blocks
  namespace: folio-prod
spec:
  destination:
    namespace: folio-prod
    server: https://kubernetes.default.svc
  project: folio-prod
  sources:
  - chart: mod-patron-blocks
    helm:
      valueFiles:
      - $values/folio-prod/modules/mod-patron-blocks/overrides.yaml
      - $values/folio-prod/modules/mod-patron-blocks/resources.yaml
      - $values/folio-prod/common/sidecar.yaml
      - $values/folio-prod/common/probes.yaml
      - $values/folio-prod/modules/mod-patron-blocks/replicas.yaml
    repoURL: https://sul-dlss.github.io/folio-helm-v2
    targetRevision: 1.9.48
  - ref: values
    repoURL: https://github.com/sul-dlss/folio-eureka
    targetRevision: main
