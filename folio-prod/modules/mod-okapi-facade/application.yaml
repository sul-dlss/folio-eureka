apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: mod-okapi-facade
  namespace: folio-prod
spec:
  destination:
    namespace: folio-prod
    server: https://kubernetes.default.svc
  project: folio-prod
  sources:
  - chart: mod-okapi-facade
    helm:
      valueFiles:
      - $values/folio-prod/modules/mod-okapi-facade/overrides.yaml
      - $values/folio-prod/common/resources.yaml
      - $values/folio-prod/common/sidecar.yaml
      - $values/folio-prod/common/probes.yaml
    repoURL: https://sul-dlss.github.io/folio-helm-v2
    targetRevision: 0.0.27
  - ref: values
    repoURL: https://github.com/sul-dlss/folio-eureka
    targetRevision: main
