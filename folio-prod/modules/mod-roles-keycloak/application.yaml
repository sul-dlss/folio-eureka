apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: mod-roles-keycloak
  namespace: folio-prod
spec:
  destination:
    namespace: folio-prod
    server: https://kubernetes.default.svc
  project: folio-prod
  sources:
  - chart: mod-roles-keycloak
    helm:
      valueFiles:
      - $values/folio-prod/modules/mod-roles-keycloak/overrides.yaml
      - $values/folio-prod/modules/mod-roles-keycloak/resources.yaml
      - $values/folio-prod/common/sidecar.yaml
      - $values/folio-prod/common/probes.yaml
      - $values/folio-prod/modules/mod-roles-keycloak/replicas.yaml
      - $values/folio-prod/common/java_opts.yaml
      - $values/folio-prod/modules/mod-roles-keycloak/extra_env.yaml
    repoURL: https://sul-dlss.github.io/folio-helm-v2
    targetRevision: 0.0.51
  - ref: values
    repoURL: https://github.com/sul-dlss/folio-eureka
    targetRevision: main
