apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  labels:
    application: app-linked-data-1.1.7
    type: module
  name: mod-linked-data
  namespace: folio-prod
spec:
  destination:
    namespace: folio-prod
    server: https://kubernetes.default.svc
  project: folio-prod
  sources:
  - chart: mod-linked-data
    helm:
      valueFiles:
      - $values/folio-prod/modules/mod-linked-data/overrides.yaml
      - $values/folio-prod/common/resources.yaml
      - $values/folio-prod/common/sidecar.yaml
      - $values/folio-prod/common/probes.yaml
      - $values/folio-prod/modules/mod-linked-data/replicas.yaml
      - $values/folio-prod/common/java_opts.yaml
    repoURL: https://sul-dlss.github.io/folio-helm-v2
    targetRevision: 1.0.31
  - ref: values
    repoURL: https://github.com/sul-dlss/folio-eureka
    targetRevision: main
