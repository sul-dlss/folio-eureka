apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: mod-licenses
  namespace: folio-prod
spec:
  destination:
    namespace: folio-prod
    server: https://kubernetes.default.svc
  project: folio-prod
  sources:
  - chart: mod-licenses
    helm:
      valueFiles:
      - $values/folio-prod/modules/mod-licenses/overrides.yaml
      - $values/folio-prod/modules/mod-licenses/resources.yaml
      - $values/folio-prod/common/sidecar.yaml
      - $values/folio-prod/modules/mod-licenses/probes.yaml
      - $values/folio-prod/modules/mod-licenses/replicas.yaml
    repoURL: https://sul-dlss.github.io/folio-helm-v2
    targetRevision: 5.0.50
  - ref: values
    repoURL: https://github.com/sul-dlss/folio-eureka
    targetRevision: main
