apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: mod-circulation
  namespace: folio-prod
spec:
  destination:
    namespace: folio-prod
    server: https://kubernetes.default.svc
  project: folio-prod
  sources:
  - chart: mod-circulation
    helm:
      valueFiles:
      - $values/folio-prod/modules/mod-circulation/overrides.yaml
      - $values/folio-prod/modules/mod-circulation/resources.yaml
      - $values/folio-prod/common/sidecar.yaml
      - $values/folio-prod/modules/mod-circulation/probes.yaml
      - $values/folio-prod/modules/mod-circulation/replicas.yaml
    repoURL: https://sul-dlss.github.io/folio-helm-v2
    targetRevision: 24.1.43
  - ref: values
    repoURL: https://github.com/sul-dlss/folio-eureka
    targetRevision: main
