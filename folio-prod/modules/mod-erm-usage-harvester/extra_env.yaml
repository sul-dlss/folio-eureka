extraEnvVars: |
  - name: OKAPI_URL
    value: "http://localhost:8082"
  - name: SUL_USER_NAME
    valueFrom:
      secretKeyRef:
        name: folio-eureka
        key: SUL_ERM_USER_NAME
  - name: SUL_USER_PASSWORD
    valueFrom:
      secretKeyRef:
        name: folio-eureka
        key: SUL_ERM_USER_PASS
