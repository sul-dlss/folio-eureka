extraEnvVars: |
  - name: OKAPI_URL
    value: "http://localhost:8082"
  - name: HZ_CLUSTERNAME
    value: "mod-erm-usage-harvester"
  - name: HZ_NETWORK_JOIN_AUTODETECTION_ENABLED
    value: "false"
  - name: HZ_NETWORK_JOIN_KUBERNETES_ENABLED
    value: "true"
  - name: HZ_NETWORK_JOIN_KUBERNETES_SERVICEDNS
    value: "mod-erm-usage-harvester-hazelcast.folio-prod.svc.cluster.local"
  - name: SUL_USER_NAME
    valueFrom:
      secretKeyRef:
        name: mod-erm-usage-harvester-system-user
        key: SUL_USER_NAME
  - name: SUL_USER_PASS
    valueFrom:
      secretKeyRef:
        name: mod-erm-usage-harvester-system-user
        key: SUL_USER_PASS
