apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: mod-pubsub
  namespace: folio-prod
spec:
  destination:
    namespace: folio-prod
    server: https://kubernetes.default.svc
  project: folio-prod
  sources:
  - chart: mod-pubsub
    helm:
      valueFiles:
      - $values/folio-prod/modules/mod-pubsub/overrides.yaml
      - $values/folio-prod/modules/mod-pubsub/resources.yaml
      - $values/folio-prod/common/sidecar.yaml
      - $values/folio-prod/common/probes.yaml
      - $values/folio-prod/modules/mod-pubsub/replicas.yaml
      - $values/folio-prod/common/java_opts.yaml
      - $values/folio-prod/modules/mod-pubsub/extra_env.yaml
    repoURL: https://sul-dlss.github.io/folio-helm-v2
    targetRevision: 3.0.41
  - ref: values
    repoURL: https://github.com/sul-dlss/folio-eureka
    targetRevision: main
