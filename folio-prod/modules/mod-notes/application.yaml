apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: mod-notes
  namespace: folio-prod
spec:
  destination:
    namespace: folio-prod
    server: https://kubernetes.default.svc
  project: folio-prod
  sources:
  - chart: mod-notes
    helm:
      valueFiles:
      - $values/folio-prod/modules/mod-notes/overrides.yaml
      - $values/folio-prod/modules/mod-notes/resources.yaml
      - $values/folio-prod/common/sidecar.yaml
      - $values/folio-prod/common/probes.yaml
      - $values/folio-prod/modules/mod-notes/replicas.yaml
      - $values/folio-prod/common/java_opts.yaml
    repoURL: https://sul-dlss.github.io/folio-helm-v2
    targetRevision: 5.1.48
  - ref: values
    repoURL: https://github.com/sul-dlss/folio-eureka
    targetRevision: main
