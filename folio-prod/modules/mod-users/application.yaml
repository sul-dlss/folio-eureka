apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: mod-users
  namespace: folio-prod
spec:
  destination:
    namespace: folio-prod
    server: https://kubernetes.default.svc
  project: folio-prod
  sources:
  - chart: mod-users
    helm:
      valueFiles:
      - $values/folio-prod/modules/mod-users/overrides.yaml
      - $values/folio-prod/modules/mod-users/resources.yaml
      - $values/folio-prod/common/sidecar.yaml
      - $values/folio-prod/common/probes.yaml
      - $values/folio-prod/modules/mod-users/replicas.yaml
      - $values/folio-prod/modules/mod-users/extra_env.yaml
    repoURL: https://sul-dlss.github.io/folio-helm-v2
    targetRevision: 19.3.41
  - ref: values
    repoURL: https://github.com/sul-dlss/folio-eureka
    targetRevision: main
