apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: edge-ncip
  namespace: folio-prod
spec:
  destination:
    namespace: folio-prod
    server: https://kubernetes.default.svc
  project: folio-prod
  sources:
  - chart: edge-ncip
    helm:
      valueFiles:
      - $values/folio-prod/modules/edge-ncip/overrides.yaml
      - $values/folio-prod/modules/edge-ncip/resources.yaml
      - $values/folio-prod/common/probes.yaml
      - $values/folio-prod/modules/edge-ncip/service.yaml
      - $values/folio-prod/modules/edge-ncip/java_opts.yaml
      - $values/folio-prod/modules/edge-ncip/extra_env.yaml
    repoURL: https://sul-dlss.github.io/folio-helm-v2
    targetRevision: 1.10.0
  - ref: values
    repoURL: https://github.com/sul-dlss/folio-eureka
    targetRevision: main
