image:
  pullPolicy: Always
  repository: ghcr.io/sul-dlss/folio-platform-complete
  tag: R1-2025-csp-7-eureka-prod
replicaCount: 2

deploymentStrategy: RollingUpdate
startupProbeEnabled : true
livenessProbeEnabled : true
readinessProbeEnabled : true

extraDeploy:
  - |
    apiVersion: gateway.networking.k8s.io/v1
    kind: HTTPRoute
    metadata:
      name: platform-complete-backend
      namespace: folio-prod
      labels:
        access: cors-ip-allowlist
    spec:
      rules:
      - backendRefs:
        - name: platform-complete
          port: 80
        matches:
          - path:
              type: PathPrefix
              value: /
      hostnames:
      - folio.stanford.edu
      parentRefs:
      - name: default
        namespace: envoy-gateway-system
