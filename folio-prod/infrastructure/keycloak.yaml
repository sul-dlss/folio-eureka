              - "10.96.0.0/11"
              - "10.98.0.0/15"
              - "10.130.0.0/18"
              - "10.130.64.0/18"
              - "10.130.128.0/18"
              - "10.130.192.0/18"
              - "172.24.0.0/14"
              - "172.20.206.128/25"
              - "172.20.207.0/25"
              - "171.66.16.0/21"
