image:
  repository: "bitnamilegacy/kafka"
  tag: "3.9.0-debian-12-r1"
global:
  security:
    allowInsecureImages: true
controller:
  extraEnvVars:
    - name: KAFKA_OPTS
      value: "-XX:-UseBASE64Intrinsics"
  resources:
    requests:
      cpu: '.5'
      memory: 1536M
    limits:
      cpu: '1'
      memory: 2048M
  persistence:
    size: 80Gi
  startupProbe:
    enabled: true
    initialDelaySeconds: 5
    periodSeconds: 10
    timeoutSeconds: 10
    failureThreshold: 300
  readinessProbe:
    enabled: true
    initialDelaySeconds: 5
    periodSeconds: 30
    timeoutSeconds: 10
    failureThreshold: 30
  livenessProbe:
    enabled: true
    initialDelaySeconds: 5
    periodSeconds: 30
    timeoutSeconds: 10
    failureThreshold: 30
heapOpts: "-XX:MaxRAMPercentage=80 -XX:MinRAMPercentage=80 -XX:+UseG1GC"

extraConfig: |
  default.replication.factor=3
  log.retention.hours=72
  log.retention.bytes=6442000000
  num.network.threads=24
  num.io.threads=24
  deleteTopicEnable=true

kraft:
  existingClusterIdSecret: kafka-credentials
sasl:
  existingSecret: kafka-credentials
listeners:
  client:
    protocol: PLAINTEXT
  interbroker:
    protocol: PLAINTEXT
# jmx-exporter disabled: its java command is hardcoded in the chart, so it cannot get -XX:-UseBASE64Intrinsics
metrics:
  jmx:
    enabled: false
  serviceMonitor:
    enabled: false
