apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kafka-exporter-folio-prod
  namespace: folio-prod
  labels:
    type: infrastructure
spec:
  project: folio-prod
  destination:
    server: https://kubernetes.default.svc
    namespace: folio-prod
  sources:
    - repoURL: https://prometheus-community.github.io/helm-charts
      chart: prometheus-kafka-exporter
      targetRevision: 4.1.2
      helm:
        valueFiles:
        - $values/folio-prod/infrastructure/kafka-exporter.yaml
    - repoURL: https://github.com/sul-dlss/folio-eureka
      targetRevision: main
      ref: values
